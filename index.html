<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SSC CGL 2027 Tracker</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="flame" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2c1 3-2 4-2 7a3 3 0 0 0 6 0c1.5 1.5 2 3.5 2 5.5A6.5 6.5 0 0 1 5 14.5C5 9 9 6 12 2Z" fill="currentColor"/>
      </svg>
      <div>
        <h1>SSC CGL 2027</h1>
        <p class="subtitle">Study Tracker</p>
      </div>
    </div>
    <div class="streak-pill" id="streakPill">
      <svg class="flame small" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2c1 3-2 4-2 7a3 3 0 0 0 6 0c1.5 1.5 2 3.5 2 5.5A6.5 6.5 0 0 1 5 14.5C5 9 9 6 12 2Z" fill="currentColor"/>
      </svg>
      <span id="streakCount">0</span>
      <span class="streak-label">day streak</span>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="today">Today</button>
    <button class="tab-btn" data-tab="subjects">Subjects</button>
    <button class="tab-btn" data-tab="progress">Progress</button>
  </nav>

  <main id="app"></main>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
